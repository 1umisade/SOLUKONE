<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solukone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0f0a;
      color: #d4e8d4;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: #7ecf7e;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1rem;
      letter-spacing: 0.15em;
      color: #5a8a5a;
      margin-bottom: 48px;
      text-transform: uppercase;
    }

    .video-wrapper {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(100, 200, 100, 0.08);
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: #3a5a3a;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <h1>SOLUKONE</h1>
  <p class="subtitle">Interaktiivinen solusimulaatio &mdash; Turun yliopisto</p>

  <div class="video-wrapper">
    <!-- REPLACE "VIDEO_ID_HERE" with the YouTube video ID -->
    <iframe
      src="https://www.youtube.com/embed/VIDEO_ID_HERE"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <footer>solukone.com &mdash; University of Turku</footer>

</body>
</html>
